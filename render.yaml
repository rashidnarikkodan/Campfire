services:
  - type: web
    name: internet-campfire-server
    env: node
    region: singapore # or oregon, frankfurt, etc.
    plan: free # or starter
    buildCommand: pnpm install && pnpm run build:server
    startCommand: pnpm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://internet-campfire.vercel.app
